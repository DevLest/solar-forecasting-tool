# Render Blueprint for the hosted, read-only "Viewer" instance.
#
# This deploys ONLY the public-facing Viewer - it never becomes the source of
# truth. Your local app (run_dashboard.py) stays the source of truth and
# pushes snapshots here on a timer (see app/services/sync_service.py). The
# local app is never deployed and never exposed to the internet.
#
# One-time setup before your first deploy:
#   1. Open users.viewer.example.json and replace the placeholder password
#      hash with your own:
#        python -c "from werkzeug.security import generate_password_hash; print(generate_password_hash('your-viewer-password'))"
#      Commit that change. This is the ONLY account that will ever exist on
#      the public instance (role: spectator - no admin, no nominator, no
#      settings/env-editing access). Do this BEFORE the first deploy: once
#      deployed, data/viewer_users.json is seeded from this file once and then
#      left alone, and there is no admin UI on this instance to change it
#      afterwards. To rotate the password later, update the hash here and
#      remove the deployed data/viewer_users.json via the Render Shell (Starter
#      plan or above) so it reseeds on next boot.
#   2. In the Render dashboard, connect this repo and apply this Blueprint
#      (New -> Blueprint), or create the web service manually using the
#      settings below.
#   3. Set ARECO_SYNC_TOKEN (see envVars below) to a long random value, e.g.:
#        python -c "import secrets; print(secrets.token_urlsafe(32))"
#      Set the SAME value in your local .env as ARECO_SYNC_TOKEN, plus
#      ARECO_SYNC_REMOTE_URL=<this service's https URL> - that's what turns
#      the local app into the "pusher". Never set ARECO_SYNC_REMOTE_URL here
#      on the Viewer; only the local app pushes.
#
# Note on requirements.txt: it includes heavy OCR/CV libraries (playwright,
# opencv, rapidocr, pymupdf) that only the local trader app's invoice/live-
# stream OCR features use. The Viewer imports the same modules at startup
# (just doesn't call the OCR code paths), so it pays their import cost. If
# the build is slow or the instance hits memory limits on Render, the real
# fix is making those imports lazy in app/routes - ask and I'll do it.

services:
  - type: web
    name: areco-solar-viewer
    runtime: python
    plan: starter # free tier can't attach a persistent Disk and cold-starts after 15 min idle - poor experience for a public viewer
    region: singapore # closest Render region to the plant's coordinates; change if needed
    branch: master
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn --preload --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT "app:create_app()"
    healthCheckPath: /login
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: ARECO_SECRET_KEY
        generateValue: true # Render generates and stores a random session-signing key
      - key: ARECO_SYNC_TOKEN
        sync: false # set manually in the Render dashboard; must match the local app's .env exactly
      - key: ARECO_USERS_FILE
        value: data/viewer_users.json # separate from the tracked data/users.json (which has admin/nominator accounts) - never used here
      - key: ARECO_USERS_SEED_FILE
        value: users.viewer.example.json # spectator-only seed - see setup note above
      - key: ARECO_DATA_DIR
        value: /var/data # matches the disk mountPath below
    disk:
      name: areco-viewer-data
      mountPath: /var/data
      sizeGB: 1 # synced SQLite files + JSON are a few MB; 1GB is comfortably more than enough
