<header class="relative shrink-0 border-b border-brand-border bg-brand-dark2/90 backdrop-blur-md z-50 p-3 px-5 sm:p-4 sm:px-8 flex justify-between items-center overflow-hidden">
  <div class="pointer-events-none absolute inset-0 bg-circuit-grid opacity-60" aria-hidden="true"></div>
  <div class="pointer-events-none absolute inset-x-0 bottom-0 h-px bg-gradient-to-r from-transparent via-brand-accent/50 to-transparent" aria-hidden="true"></div>
  <div class="relative flex items-center space-x-3 sm:space-x-4 min-w-0">
    <div class="flex h-11 w-11 sm:h-12 sm:w-12 shrink-0 items-center justify-center rounded-lg bg-white p-1 shadow-glow ring-1 ring-white/15" title="Areco">
      <img
        src="{{ url_for('main.assets', filename='areco-logo.jpg') }}"
        alt="Areco"
        width="44"
        height="44"
        class="h-full w-full object-contain object-center"
        decoding="async"
        fetchpriority="high"
      />
    </div>
    <div class="min-w-0">
      <h1 class="flex items-center gap-2 text-xl sm:text-2xl lg:text-3xl font-bold tracking-wide sm:tracking-widest text-brand-text uppercase font-display truncate">
        ARECO 65MW SOLAR
      </h1>
      <p class="flex items-center gap-1.5 text-[10px] sm:text-xs text-brand-muted tracking-widest uppercase">
        <span class="status-dot h-1.5 w-1.5 rounded-full bg-brand-accent" aria-hidden="true"></span>
        <span id="app-subtitle">Nomination Dashboard</span>
      </p>
    </div>
  </div>
  {% block header_trailing %}
  <div class="relative flex items-center gap-3 sm:gap-6 flex-wrap justify-end">
    {% if areco_auth.can_edit_settings %}
    <button type="button" data-open-settings class="md:hidden shrink-0 rounded-lg border border-brand-border px-2.5 py-1.5 text-[10px] sm:text-xs font-semibold uppercase tracking-wide text-brand-muted hover:text-brand-accent hover:bg-brand-border/20" title="App settings">Settings</button>
    {% endif %}
    <div id="navbar-current-time" class="text-xl sm:text-2xl font-bold font-mono text-brand-accent tabular-nums" title="Current time"></div>
    <div class="flex flex-col items-end gap-1 border-l border-brand-border pl-4 sm:pl-6">
      <div class="flex items-baseline gap-2 flex-wrap justify-end">
        <span class="text-xs text-brand-muted uppercase tracking-wider">RTD Nomination</span>
        <span id="navbar-rtd-interval" class="text-sm font-mono font-semibold text-brand-muted tabular-nums min-w-[2.75rem] text-right" title="Interval end (nomination advance)"></span>
        <span id="navbar-rtd-mw" class="text-xl font-bold font-mono text-brand-accent tabular-nums">—</span>
        <span class="text-xs text-brand-muted">MW</span>
      </div>
      <div id="navbar-ocr-row" class="hidden items-baseline gap-2 flex-wrap justify-end" title="Auto-read from the live plant-output video (OCR)">
        <span id="navbar-ocr-status-dot" class="status-dot h-1.5 w-1.5 rounded-full bg-brand-accent" aria-hidden="true"></span>
        <span class="text-xs text-brand-muted uppercase tracking-wider">Live OCR</span>
        <span id="navbar-ocr-mw" class="text-2xl font-bold font-mono text-brand-accent tabular-nums">—</span>
        <span class="text-xs text-brand-muted">MW</span>
      </div>
    </div>
  </div>
  {% endblock %}
</header>
